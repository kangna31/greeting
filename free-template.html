<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Birthday Surprise - Free Version</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            font-family: 'Poppins', sans-serif;
        }
        
        .gradient-bg {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 50%, #f093fb 100%);
        }
        
        .countdown-box {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border: 2px solid rgba(255, 255, 255, 0.2);
        }
        
        .slide {
            opacity: 0;
            transition: opacity 1s ease-in-out;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }
        
        .slide.active {
            opacity: 1;
        }
        
        .slide img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }
        
        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }
        
        .animate-fadeInUp {
            animation: fadeInUp 1s ease-out forwards;
        }
        
        .animate-pulse-custom {
            animation: pulse 2s ease-in-out infinite;
        }
        
        .animate-bounce-custom {
            animation: bounce 1s ease-in-out infinite;
        }
        
        .message-card {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(10px);
            border: 2px solid rgba(255, 255, 255, 0.3);
        }
        
        .nav-dot {
            transition: all 0.3s ease;
        }
        
        .nav-dot.active {
            background: white;
            transform: scale(1.3);
        }
    </style>
</head>
<body class="gradient-bg min-h-screen overflow-x-hidden">
    <!-- Screen 1: Countdown Timer -->
    <div id="screen-countdown" class="min-h-screen flex flex-col items-center justify-center p-4">
        <h1 class="text-4xl md:text-6xl font-bold text-white mb-4 text-center animate-pulse-custom">
            🎂 Birthday Countdown 🎂
        </h1>
        <p class="text-xl text-white/80 mb-8 text-center">Counting down to the special moment!</p>
        
        <div class="grid grid-cols-4 gap-4 md:gap-8 mb-8">
            <div class="countdown-box rounded-2xl p-4 md:p-8 text-center min-w-[80px] md:min-w-[120px]">
                <div id="days" class="text-3xl md:text-5xl font-bold text-white">00</div>
                <div class="text-white/70 text-sm md:text-base">Days</div>
            </div>
            <div class="countdown-box rounded-2xl p-4 md:p-8 text-center min-w-[80px] md:min-w-[120px]">
                <div id="hours" class="text-3xl md:text-5xl font-bold text-white">00</div>
                <div class="text-white/70 text-sm md:text-base">Hours</div>
            </div>
            <div class="countdown-box rounded-2xl p-4 md:p-8 text-center min-w-[80px] md:min-w-[120px]">
                <div id="minutes" class="text-3xl md:text-5xl font-bold text-white">00</div>
                <div class="text-white/70 text-sm md:text-base">Minutes</div>
            </div>
            <div class="countdown-box rounded-2xl p-4 md:p-8 text-center min-w-[80px] md:min-w-[120px]">
                <div id="seconds" class="text-3xl md:text-5xl font-bold text-white">00</div>
                <div class="text-white/70 text-sm md:text-base">Seconds</div>
            </div>
        </div>
        
        <button onclick="skipCountdown()" class="bg-white text-purple-600 font-semibold px-8 py-3 rounded-full hover:bg-purple-50 transition-colors animate-bounce-custom">
            Skip to Surprise →
        </button>
    </div>
    
    <!-- Screen 2: Photo Slideshow -->
    <div id="screen-slideshow" class="min-h-screen flex flex-col items-center justify-center p-4 hidden">
        <h2 class="text-3xl md:text-5xl font-bold text-white mb-6 text-center">📸 Precious Memories 📸</h2>
        
        <div class="relative w-full max-w-2xl h-[400px] md:h-[500px] rounded-2xl overflow-hidden shadow-2xl">
            <div class="slide active">
                <img src="https://images.unsplash.com/photo-1530103862676-de8c9debad1d?w=800&h=600&fit=crop" alt="Birthday moment 1">
            </div>
            <div class="slide">
                <img src="https://images.unsplash.com/photo-1558636508-e0db3814bd1d?w=800&h=600&fit=crop" alt="Birthday moment 2">
            </div>
            <div class="slide">
                <img src="https://images.unsplash.com/photo-1513151233558-d860c5398176?w=800&h=600&fit=crop" alt="Birthday moment 3">
            </div>
            <div class="slide">
                <img src="https://images.unsplash.com/photo-1464349153735-7db50ed83c84?w=800&h=600&fit=crop" alt="Birthday moment 4">
            </div>
            <div class="slide">
                <img src="https://images.unsplash.com/photo-1527529482837-4698179dc6ce?w=800&h=600&fit=crop" alt="Birthday moment 5">
            </div>
        </div>
        
        <div class="flex gap-2 mt-6">
            <button onclick="changeSlide(-1)" class="bg-white/20 text-white px-4 py-2 rounded-full hover:bg-white/30 transition-colors">←</button>
            <div class="flex gap-2 items-center">
                <span class="nav-dot w-3 h-3 rounded-full bg-white/50 active cursor-pointer" onclick="goToSlide(0)"></span>
                <span class="nav-dot w-3 h-3 rounded-full bg-white/50 cursor-pointer" onclick="goToSlide(1)"></span>
                <span class="nav-dot w-3 h-3 rounded-full bg-white/50 cursor-pointer" onclick="goToSlide(2)"></span>
                <span class="nav-dot w-3 h-3 rounded-full bg-white/50 cursor-pointer" onclick="goToSlide(3)"></span>
                <span class="nav-dot w-3 h-3 rounded-full bg-white/50 cursor-pointer" onclick="goToSlide(4)"></span>
            </div>
            <button onclick="changeSlide(1)" class="bg-white/20 text-white px-4 py-2 rounded-full hover:bg-white/30 transition-colors">→</button>
        </div>
        
        <button onclick="skipSlideshow()" class="mt-6 bg-white text-purple-600 font-semibold px-8 py-3 rounded-full hover:bg-purple-50 transition-colors">
            Continue to Messages →
        </button>
    </div>
    
    <!-- Screen 3: Personalized Messages -->
    <div id="screen-messages" class="min-h-screen flex flex-col items-center justify-center p-4 hidden">
        <h2 class="text-3xl md:text-5xl font-bold text-white mb-6 text-center">💝 Birthday Wishes 💝</h2>
        
        <div class="message-card rounded-2xl p-6 md:p-8 max-w-2xl w-full mb-6">
            <div id="message-container" class="text-white text-lg md:text-xl text-center leading-relaxed min-h-[200px] flex items-center justify-center">
                <p id="current-message" class="animate-fadeInUp"></p>
            </div>
        </div>
        
        <div class="flex gap-4">
            <button onclick="prevMessage()" class="bg-white/20 text-white px-6 py-3 rounded-full hover:bg-white/30 transition-colors">← Previous</button>
            <button onclick="nextMessage()" class="bg-white text-purple-600 font-semibold px-6 py-3 rounded-full hover:bg-purple-50 transition-colors">Next →</button>
        </div>
        
        <button onclick="showFinalCelebration()" class="mt-8 bg-gradient-to-r from-yellow-400 to-orange-500 text-white font-semibold px-8 py-3 rounded-full hover:opacity-90 transition-opacity animate-bounce-custom">
            🎉 Celebrate Now! 🎉
        </button>
    </div>
    
    <!-- Screen 4: Final Celebration -->
    <div id="screen-celebration" class="min-h-screen flex flex-col items-center justify-center p-4 hidden">
        <h1 class="text-4xl md:text-7xl font-bold text-white mb-4 text-center animate-pulse-custom">
            🎉 Happy Birthday! 🎉
        </h1>
        <p class="text-xl md:text-3xl text-white/90 mb-8 text-center">Wishing you all the happiness in the world!</p>
        
        <div class="text-6xl md:text-9xl mb-8 animate-bounce-custom">🎂</div>
        
        <button onclick="triggerConfetti()" class="bg-white text-purple-600 font-semibold px-8 py-4 rounded-full hover:bg-purple-50 transition-colors text-lg">
            🎊 More Confetti! 🎊
        </button>
        
        <a href="index.html" class="mt-6 text-white/70 hover:text-white transition-colors">
            ← Back to Templates
        </a>
    </div>

    <script>
        // Countdown Timer
        let countdownInterval;
        const targetDate = new Date();
        targetDate.setDate(targetDate.getDate() + 7); // 7 days from now
        
        function updateCountdown() {
            const now = new Date().getTime();
            const distance = targetDate - now;
            
            const days = Math.floor(distance / (1000 * 60 * 60 * 24));
            const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((distance % (1000 * 60)) / 1000);
            
            document.getElementById('days').textContent = String(days).padStart(2, '0');
            document.getElementById('hours').textContent = String(hours).padStart(2, '0');
            document.getElementById('minutes').textContent = String(minutes).padStart(2, '0');
            document.getElementById('seconds').textContent = String(seconds).padStart(2, '0');
            
            if (distance < 0) {
                clearInterval(countdownInterval);
                skipCountdown();
            }
        }
        
        countdownInterval = setInterval(updateCountdown, 1000);
        updateCountdown();
        
        function skipCountdown() {
            clearInterval(countdownInterval);
            document.getElementById('screen-countdown').classList.add('hidden');
            document.getElementById('screen-slideshow').classList.remove('hidden');
            triggerConfetti();
        }
        
        // Photo Slideshow
        let currentSlide = 0;
        const slides = document.querySelectorAll('.slide');
        const dots = document.querySelectorAll('.nav-dot');
        let slideInterval;
        
        function showSlide(index) {
            slides.forEach(slide => slide.classList.remove('active'));
            dots.forEach(dot => dot.classList.remove('active'));
            
            currentSlide = (index + slides.length) % slides.length;
            slides[currentSlide].classList.add('active');
            dots[currentSlide].classList.add('active');
        }
        
        function changeSlide(direction) {
            showSlide(currentSlide + direction);
        }
        
        function goToSlide(index) {
            showSlide(index);
        }
        
        function startSlideshow() {
            slideInterval = setInterval(() => changeSlide(1), 3000);
        }
        
        function stopSlideshow() {
            clearInterval(slideInterval);
        }
        
        startSlideshow();
        
        function skipSlideshow() {
            stopSlideshow();
            document.getElementById('screen-slideshow').classList.add('hidden');
            document.getElementById('screen-messages').classList.remove('hidden');
            showMessage(0);
            triggerConfetti();
        }
        
        // Personalized Messages
        const messages = [
            "On this special day, I want you to know how much you mean to me. You bring so much joy and laughter into my life! 🌟",
            "Another year older, another year wiser, and another year more amazing. May this birthday be as wonderful as you are! 💖",
            "Today celebrates the day the world became brighter with your presence. Thank you for being you! 🎈",
            "Wishing you a day filled with love, laughter, and all your favorite things. You deserve the world! 🌸",
            "May this year bring you new adventures, wonderful memories, and endless happiness. Happy Birthday! 🎁"
        ];
        
        let currentMessage = 0;
        
        function showMessage(index) {
            currentMessage = (index + messages.length) % messages.length;
            const messageEl = document.getElementById('current-message');
            messageEl.classList.remove('animate-fadeInUp');
            void messageEl.offsetWidth; // Trigger reflow
            messageEl.textContent = messages[currentMessage];
            messageEl.classList.add('animate-fadeInUp');
        }
        
        function nextMessage() {
            showMessage(currentMessage + 1);
        }
        
        function prevMessage() {
            showMessage(currentMessage - 1);
        }
        
        function showFinalCelebration() {
            document.getElementById('screen-messages').classList.add('hidden');
            document.getElementById('screen-celebration').classList.remove('hidden');
            triggerConfetti();
            setTimeout(triggerConfetti, 500);
            setTimeout(triggerConfetti, 1000);
        }
        
        // Confetti Effect
        function triggerConfetti() {
            confetti({
                particleCount: 100,
                spread: 70,
                origin: { y: 0.6 }
            });
            
            setTimeout(() => {
                confetti({
                    particleCount: 50,
                    angle: 60,
                    spread: 55,
                    origin: { x: 0 }
                });
            }, 200);
            
            setTimeout(() => {
                confetti({
                    particleCount: 50,
                    angle: 120,
                    spread: 55,
                    origin: { x: 1 }
                });
            }, 400);
        }
    </script>
</body>
</html>
